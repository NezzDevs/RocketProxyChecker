name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app bundle
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Package disk image
        run: |
          chmod +x make-dmg.sh
          ./make-dmg.sh

      - name: Verify the image mounts
        run: |
          hdiutil attach RocketProxyChecker.dmg \
            -mountpoint /Volumes/RocketProxyCheckerTest -nobrowse -readonly
          test -d "/Volumes/RocketProxyCheckerTest/Rocket Proxy Checker.app"
          test -L "/Volumes/RocketProxyCheckerTest/Applications"
          hdiutil detach /Volumes/RocketProxyCheckerTest

      - name: Prune stale assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view Latest --json assets -q '.assets[].name' > assets.txt 2>/dev/null; then
            while read -r asset; do
              if [ -n "$asset" ] && [ "$asset" != "RocketProxyChecker.dmg" ]; then
                echo "Removing stale asset: $asset"
                gh release delete-asset Latest "$asset" -y || true
              fi
            done < assets.txt
          fi
          rm -f assets.txt

      - name: Move Latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f Latest
          git push -f origin Latest

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RocketProxyChecker.dmg
          generate_release_notes: true
          body: |
            ### Install

            1. Download **RocketProxyChecker.dmg** below and open it.
            2. Drag **Rocket Proxy Checker** into Applications.
            3. First launch only, clear the quarantine flag:

               ```
               xattr -dr com.apple.quarantine "/Applications/Rocket Proxy Checker.app"
               ```

            Ad-hoc signed rather than notarized, so Gatekeeper blocks it
            until that flag is cleared.

            Requires macOS 14 or later on Apple silicon.

      - name: Update Latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: RocketProxyChecker.dmg
          tag_name: Latest
          name: Latest build
          prerelease: false
          make_latest: true
          body: |
            Automatic build of `main` — commit ${{ github.sha }}.

            1. Download **RocketProxyChecker.dmg** below and open it.
            2. Drag **Rocket Proxy Checker** into Applications.
            3. First launch only:

               ```
               xattr -dr com.apple.quarantine "/Applications/Rocket Proxy Checker.app"
               ```

            Requires macOS 14 or later on Apple silicon.

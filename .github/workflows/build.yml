name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app bundle
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Package disk image
        run: |
          chmod +x make-dmg.sh
          ./make-dmg.sh

      - name: Verify the image mounts
        run: |
          hdiutil attach ProxyChecker.dmg \
            -mountpoint /Volumes/ProxyCheckerTest -nobrowse -readonly
          test -d "/Volumes/ProxyCheckerTest/Proxy Checker.app"
          test -L "/Volumes/ProxyCheckerTest/Applications"
          hdiutil detach /Volumes/ProxyCheckerTest

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ProxyChecker.dmg
          generate_release_notes: true
          body: |
            ### Install

            1. Download **ProxyChecker.dmg** below and open it.
            2. Drag **Proxy Checker** into Applications.
            3. First launch only, clear the quarantine flag:

               ```
               xattr -dr com.apple.quarantine "/Applications/Proxy Checker.app"
               ```

            Ad-hoc signed rather than notarized, so Gatekeeper blocks it
            until that flag is cleared.

            Requires macOS 14 or later on Apple silicon.

      - name: Update latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: ProxyChecker.dmg
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automatic build of `main` — commit ${{ github.sha }}.

            1. Download **ProxyChecker.dmg** below and open it.
            2. Drag **Proxy Checker** into Applications.
            3. First launch only:

               ```
               xattr -dr com.apple.quarantine "/Applications/Proxy Checker.app"
               ```

            Requires macOS 14 or later on Apple silicon.
